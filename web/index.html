<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Garden</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>MY QUIET GARDEN</small><h1>Mind Garden</h1><p>화면을 내려놓으면, 정원이 자랍니다.</p></header><section id="room"><div id="sun">☀</div><div id="plant">🌱</div></section><section class="card"><div class="row"><div><span>오늘의 햇살 휴식</span><strong id="time">00:00</strong></div><div><span>성장 단계</span><strong id="stage">새싹</strong></div></div><button id="rest">햇살 휴식 시작</button><p id="msg">창가처럼 밝고 시원한 곳에 휴대폰을 내려놓아 보세요.</p></section><section class="actions"><button id="water">💧<span>물주기</span></button><button id="leaf">✨<span>잎 닦기</span></button><label>🏠<span>우리 집</span><input id="photo" type="file" accept="image/*"></label></section><section class="card"><h2>오늘의 정원</h2><p>휴식하는 동안 식물은 조용히 자랍니다. 중간에 돌아와도 벌점은 없어요.</p><div class="progress"><i id="bar"></i></div><small id="next">다음 잎까지 10분</small></section></main><script src="app.js"></script></body></html>
