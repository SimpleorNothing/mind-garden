<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Garden</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>MY QUIET GARDEN</small><h1>Mind Garden</h1><p>화면을 내려놓으면, 정원이 자랍니다.</p></header><section id="room"><div id="sun">☀</div><div id="plant">🌱</div><div class="floor"></div></section><section class="card"><div class="row"><div><span>오늘의 햇살 휴식</span><strong id="time">00:00</strong></div><div><span>성장 단계</span><strong id="stage">새싹</strong></div></div><button id="rest">햇살 휴식 시작</button><p id="msg">창가처럼 밝고 시원한 곳에 휴대폰을 내려놓아 보세요.</p></section><section class="actions"><button id="water">💧<span>물주기</span></button><button id="leaf">✨<span>잎 닦기</span></button><label>🏠<span>우리 집</span><input id="photo" type="file" accept="image/*"></label></section><section class="card"><h2>오늘의 정원</h2><p>식물은 시간이 지나면 천천히 자랍니다. 햇살 휴식을 하면 성장이 조금 더 빨라져요.</p><div class="progress"><i id="bar"></i></div><small id="next">다음 성장 예상 시간 계산 중</small></section></main><script src="app.js"></script></body></html>
