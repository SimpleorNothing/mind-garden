<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Garden Lab</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>ENVIRONMENT LAB</small><h1>Mind Garden</h1><p>시간 · 날씨 · 배경 테스트</p></header><section id="room"><canvas id="neutralCanvas"></canvas><div id="tint"></div><div id="clouds"></div><canvas id="rain"></canvas><div id="sunOrb">☀</div><div id="pot"><div class="plant">🌿</div><div class="potBody"></div><div class="shadow"></div></div></section><section class="panel"><div class="status"><b id="clock">12:00</b><span id="phase">낮</span><span id="weatherText">맑음</span></div><label>시간 <input id="timeSlider" type="range" min="0" max="1439" value="720"><output id="timeOut">12:00</output></label><div class="chips"><button data-w="clear" class="on">☀ 맑음</button><button data-w="cloudy">☁ 흐림</button><button data-w="rain">🌧 비</button></div><div class="row"><label class="upload">🏠 배경 변경<input id="photo" type="file" accept="image/*"></label><button id="now">현재시간</button></div><div class="neutralRow"><label><input id="neutralize" type="checkbox" checked> 업로드 사진 시간중립화</label><span id="neutralState">ON</span></div><small>검증 기준 · 도곡1동 남향 · 오전 태양 왼쪽/그림자 우하향 · 오후 태양 오른쪽/그림자 좌하향 · 일출 06:18 / 일몰 18:24 (테스트값)</small></section><section class="panel info"><b>렌더링 상태</b><div id="debug"></div><p class="note">시간중립화는 업로드 사진의 넓은 밝기 차이를 분석해 직사광·그림자 흔적을 완화한 뒤 시간대별 조명을 다시 적용합니다.</p></section></main><script src="app.js"></script></body></html>
