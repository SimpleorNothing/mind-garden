name: Build Mind Garden APK
on:
  push:
    branches: [main]
    paths: ["app/**","*.gradle.kts","gradle.properties","settings.gradle.kts"]
  pull_request:
    branches: [main]
    paths: ["app/**","web/local-store.js","tests/**","*.gradle.kts","gradle.properties","settings.gradle.kts",".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mind-garden-stable-debug-signing-v2
      - name: Prepare persistent update signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Validate local garden storage
        run: node --test tests/local-store.test.cjs
      - run: gradle assembleDebug assembleLive assembleLocal
      - uses: actions/upload-artifact@v4
        with:
          name: mind-garden-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mind-garden-live-apk
          path: app/build/outputs/apk/live/app-live.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mind-garden-local-apk
          path: app/build/outputs/apk/local/app-local.apk
