<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Garden</title><link rel="stylesheet" href="style.css?v=36"></head><body><main><header><small>MY QUIET GARDEN</small><h1>Mind Garden</h1><p>화면을 내려놓으면, 정원이 자랍니다.</p></header><section id="room"><img id="roomPhoto" alt="우리 집 배경"><div id="liveLight"></div><div id="sun">☀</div><div id="plantShadow"></div><div id="plant" aria-label="가상 식물"><svg viewBox="0 0 180 220" role="img"><defs><linearGradient id="potG" x1="0" x2="1"><stop offset="0" stop-color="#e8e1d4"/><stop offset=".5" stop-color="#fffaf0"/><stop offset="1" stop-color="#cfc5b6"/></linearGradient><linearGradient id="leafG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#347c32"/><stop offset=".55" stop-color="#78bd45"/><stop offset="1" stop-color="#b9dc68"/></linearGradient><radialGradient id="soilG"><stop offset="0" stop-color="#59422f"/><stop offset="1" stop-color="#2f241c"/></radialGradient><filter id="ps"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-opacity=".22"/></filter></defs><ellipse cx="90" cy="207" rx="56" ry="9" fill="#000" opacity=".13"/><g filter="url(#ps)"><ellipse cx="90" cy="183" rx="49" ry="10" fill="#eee7db"/><path d="M47 142h86l-8 55c-1 7-8 11-15 11H70c-8 0-14-4-15-11z" fill="url(#potG)"/><ellipse cx="90" cy="142" rx="43" ry="12" fill="#f7f0e4"/><ellipse cx="90" cy="142" rx="35" ry="8" fill="url(#soilG)"/></g><path d="M90 143C89 118 91 91 88 66M89 104C73 91 61 78 50 65M90 91c16-14 29-27 39-43M89 119c18-9 31-18 42-31" fill="none" stroke="#3f7f3b" stroke-width="6" stroke-linecap="round"/><g fill="url(#leafG)"><path d="M87 68C61 69 44 56 42 36c25-3 45 8 45 32z"/><path d="M91 91c6-27 24-44 48-43 0 27-17 43-48 43z"/><path d="M87 105c-25 3-43-7-49-26 23-8 45 1 49 26z"/><path d="M91 120c12-23 31-34 52-29-6 24-25 35-52 29z"/><path d="M89 68c-7-22 0-42 17-54 14 19 8 42-17 54z"/></g><g fill="none" stroke="#d7ed9a" stroke-width="1.5" opacity=".65"><path d="M48 42l36 23"/><path d="M132 53L96 86"/><path d="M45 83l38 19"/><path d="M136 95l-39 21"/><path d="M104 20L91 62"/></g></svg></div></section><div id="editPanel"><div class="editRow"><strong id="editTarget">화분 조절</strong><button id="editPlant" type="button">화분</button><button id="editRoom" type="button">내 집</button></div><div class="editRow"><button id="sizeMinus" type="button">−</button><span id="editHint">드래그로 위치 이동 · ± 크기</span><button id="sizePlus" type="button">＋</button><button id="editDone" type="button">완료</button></div></div><section class="card"><div class="row"><div><span>오늘의 햇살 휴식</span><strong id="time">00:00</strong></div><div><span>성장 단계</span><strong id="stage">새싹</strong></div></div><button id="rest">햇살 휴식 시작</button><p id="msg">창가처럼 밝고 시원한 곳에 휴대폰을 내려놓아 보세요.</p></section><section class="actions"><button id="water">💧<span>물주기</span></button><button id="leaf">✨<span>잎 닦기</span></button><button id="myHome">🏠<span>우리 집</span></button></section><section class="card"><h2>오늘의 정원</h2><p>휴식하는 동안 식물은 조용히 자랍니다. 중간에 돌아와도 벌점은 없어요.</p><div class="progress"><i id="bar"></i></div><small id="next">다음 잎까지 10분</small></section><section id="homeSheet" class="sheet"><div class="sheetHead"><div><small>MY PLANTS</small><h2>내가 키우는 식물</h2></div><button id="homeClose">×</button></div><div id="plantList"></div><button id="addPlant" class="primary">＋ 식물 추가</button></section><section id="addSheet" class="sheet"><div class="sheetHead"><h2>식물 추가</h2><button id="addClose">×</button></div><label class="field">이름<input id="newName" placeholder="예: 거실 몬스테라"></label><label class="field">장소<input id="newPlace" placeholder="예: 거실 창가 / 공부방 책상 위"></label><div class="choiceTitle">배경 이미지</div><div class="choices"><button id="useMine">내 이미지</button><button id="useVirtual">가상의 이미지</button></div><input id="photo" type="file" accept="image/*" hidden><div id="virtualChoices" class="virtualChoices"><button data-v="window">햇살 좋은 거실 창가</button><button data-v="desk">차분한 공부방 책상</button><button data-v="balcony">초록빛 베란다 정원</button></div><label class="liveToggle"><input id="newLive" type="checkbox" checked><span>라이브 적용</span><small>시간과 날씨에 따라 빛과 환경이 달라집니다.</small></label><button id="savePlant" class="primary">추가 완료</button></section></main><script src="app.js?v=36"></script></body></html>
